name: clone-me
services:
  app:
    image: ${APP_IMAGE:?Set an immutable APP_IMAGE digest in .release.env}
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CLONE_BIND_ADDRESS: 0.0.0.0
      CLONE_DATA_DIR: /data
      CLONE_SECURE_COOKIES: 'true'
    volumes:
      - ${CLONE_DATA_HOST:?Set the absolute host data directory}:/data
    networks:
      internal:
        ipv4_address: 172.30.23.3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: '1.5'
    stop_grace_period: 100s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.6-alpine}
    depends_on:
      app:
        condition: service_healthy
    environment:
      CLONE_DOMAIN: ${CLONE_DOMAIN:?Set the public domain}
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/${CLONE_TLS_MODE:-https}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${CLONE_CERT_HOST:?Set the absolute certificate directory}:/etc/letsencrypt:ro
      - ${CLONE_ACME_HOST:?Set the absolute ACME webroot}:/var/www/certbot:ro
    networks:
      internal:
        ipv4_address: 172.30.23.2
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: [CMD, wget, --spider, --no-check-certificate, -q, 'https://127.0.0.1/api/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: '0.25'
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v5.8.0}
    profiles: [tools]
    volumes:
      - ${CLONE_CERT_HOST}:/etc/letsencrypt
      - ${CLONE_ACME_HOST}:/var/www/certbot
    mem_limit: 128m
networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.23.0/29
