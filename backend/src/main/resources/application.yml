spring:
  application:
    name: clone-me
  threads:
    virtual:
      enabled: true
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  address: ${CLONE_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
logging:
  file:
    name: ${CLONE_LOG_FILE:./logs/clone-me.jsonl}
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-startup}] %logger{32} - %msg%n"
  level:
    cyou.jujube: INFO
    org.springframework.ai: WARN
clone:
  data-dir: ${CLONE_DATA_DIR:./data}
  secure-cookies: ${CLONE_SECURE_COOKIES:false}
  master-key: ${CLONE_MASTER_KEY:}
  deepseek-key: ${DEEPSEEK_API_KEY:}
  deepseek-model: ${DEEPSEEK_MODEL:deepseek-flash}
  deepseek-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  deepseek-input-cny-per-million: ${DEEPSEEK_INPUT_CNY_PER_MILLION:-1}
  deepseek-output-cny-per-million: ${DEEPSEEK_OUTPUT_CNY_PER_MILLION:-1}
  embedding-key: ${SILICONFLOW_API_KEY:}
  embedding-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
  embedding-model: BAAI/bge-m3
  decision-provider: ${DECISION_PROVIDER:disabled}
  typesafe-key: ${TYPESAFE_API_KEY:}
  typesafe-model: ${TYPESAFE_MODEL:jev-latest}
  typesafe-url: ${TYPESAFE_URL:https://api.typesafe.ai/v1/systemone}
  typesafe-input-cny-per-million: ${TYPESAFE_INPUT_CNY_PER_MILLION:-1}
  bailian-key: ${DASHSCOPE_API_KEY:}
  bailian-url: ${BAILIAN_DECISION_URL:}
  bailian-input-cny-per-million: ${BAILIAN_INPUT_CNY_PER_MILLION:-1}
  daily-budget-cny: 2
  lifetime-notify-cny: 5
  mail-to: ${CLONE_NOTIFY_EMAIL:}
  mail-from: ${CLONE_MAIL_FROM:}
  turnstile-key: ${TURNSTILE_SECRET_KEY:}
  turnstile-site-key: ${TURNSTILE_SITE_KEY:}
  turnstile-hostname: ${TURNSTILE_HOSTNAME:jujube.cyou}
  cookie-domain: ${CLONE_COOKIE_DOMAIN:}
